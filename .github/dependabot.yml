# Dependabot — deliberately configured for a pinned reference implementation.
#
# `open-pull-requests-limit: 0` switches OFF *version-update* pull requests (the routine
# "bump X from 1.2 to 1.3" noise). That is intentional, not neglect: this repository is a
# reference implementation pinned to a stack the test suite was validated against — Spark
# 3.5, PySpark, Kafka in KRaft mode, Redis Stack, Python 3.12 — and several of those pins
# must move together or not at all. Left on, the bumps pile up unreviewed, which reads far
# worse than a clean tree and would quietly drift the stack away from the versions the 102
# tests actually cover.
#
# What stays ON is the part that matters: **Dependabot security updates and alerts** (a
# separate repository setting) still raise a pull request when a dependency carries an actual
# advisory. Real vulnerabilities get a PR; cosmetic bumps do not.
#
# To resume routine updates, raise the limit (5 is a sane value), keep `interval: monthly`
# with the `groups:` below so an ecosystem arrives as one reviewable PR, and restore the
# major-version `ignore` rules — a Spark or Kafka major is a migration, not a bump.
version: 2

updates:
  # --- Python runtime and dev dependencies ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      python:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "python"

  # --- Python dependencies (the Streamlit Sensor Wall, deployed standalone) ---
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      python:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "python"

  # --- Dockerfiles for the simulator, Spark processor and dbt runner ---
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"

  # --- GitHub Actions used in CI ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      ci:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"

  # --- Terraform providers (the two layers) ---
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/foundation"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "terraform"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "terraform"
